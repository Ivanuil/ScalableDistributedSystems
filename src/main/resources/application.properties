spring.application.name=ScalableDistributedSystems
server.port=8080

key-value.mode=persistent

server.tomcat.threads.max=200
spring.datasource.hikari.maximum-pool-size=200

spring.datasource.left.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.left.username=postgres
spring.datasource.left.password=postgres

spring.datasource.right.url=jdbc:postgresql://localhost:5434/postgres
spring.datasource.right.username=postgres
spring.datasource.right.password=postgres
